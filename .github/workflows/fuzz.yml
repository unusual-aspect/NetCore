name: libFuzzer

on:
  push:
  pull_request:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_COMMIT: e5a1490e1409d175932ef6014519e9ae149ddb7c
  ASAN_OPTIONS: detect_leaks=1:abort_on_error=1

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config zip unzip tar curl clang

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-linux-debug-fuzz-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -x "${VCPKG_ROOT}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
            git -C "${VCPKG_ROOT}" checkout "${VCPKG_COMMIT}"
            "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure
        run: |
          cmake --preset linux-debug \
            -DENABLE_LIBFUZZER=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build out/build/linux-debug --target FrameCodecFuzz

      - name: Run FrameCodec::try_decode fuzzer
        run: |
          mkdir -p tests/fuzz/corpus
          python3 -c "
          from pathlib import Path
          body = b'{\"Type\":\"Read\",\"Seq\":0,\"Data\":\"\"}'
          frame = bytes([0xBE, 0xEF]) + len(body).to_bytes(4, 'big') + bytes([0x01, 0x00]) + body
          Path('tests/fuzz/corpus/read_empty.bin').write_bytes(frame)
          "
          out/build/linux-debug/bin/FrameCodecFuzz tests/fuzz/corpus \
            -max_total_time=60 \
            -max_len=4096 \
            -timeout=10
